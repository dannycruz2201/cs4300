<!-- booking_history.html -->

{% extends 'bookings/base.html' %}

{% block content %}

<h2>Booking History</h2>

<table class="table table-striped">

<thead>

<tr>
    <th>Movie</th>
    <th>Seat</th>
    <th>User</th>
</tr>

</thead>

<tbody>

{% for booking in bookings %}

<tr>

    <td>
        {{ booking.movie.title }}
    </td>

    <td>
        {{ booking.seat.seat_number }}
    </td>

    <td>
        {{ booking.user.username }}
    </td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
