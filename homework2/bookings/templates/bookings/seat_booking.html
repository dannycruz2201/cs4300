{% extends 'bookings/base.html' %}

{% block content %}

<h2>{{ movie.title }}</h2>

<div class="card mb-4">

    <div class="card-header">
        Book A Seat
    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary">

                Book Seat

            </button>

        </form>

    </div>

</div>

<h3>Current Seat Status</h3>

<div class="row">

{% for seat in seats %}

<div class="col-md-2 mb-2">

    {% if seat.booking_status %}

        <div class="btn btn-danger w-100">
            {{ seat.seat_number }}
        </div>

    {% else %}

        <div class="btn btn-success w-100">
            {{ seat.seat_number }}
        </div>

    {% endif %}

</div>

{% endfor %}

</div>

{% endblock %}
