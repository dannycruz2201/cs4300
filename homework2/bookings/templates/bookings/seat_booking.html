<!-- seat_booking.html -->

{% extends 'bookings/base.html' %}

{% block content %}

<h2>{{ movie.title }}</h2>

<h4>Seats</h4>

<div class="row">

{% for seat in seats %}

<div class="col-md-2 mb-3">

{% if seat.booking_status %}

<button
class="btn btn-danger w-100"
disabled>

{{ seat.seat_number }}

</button>

{% else %}

<button
class="btn btn-success w-100">

{{ seat.seat_number }}

</button>

{% endif %}

</div>

{% endfor %}

</div>

{% endblock %}
